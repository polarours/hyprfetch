[package]
name = "hyprfetch"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Hyprland-native fetch utility for system, session, and rice state"
license = "MIT"
readme = "README.md"
repository = "https://github.com/polarours/hyprfetch"
homepage = "https://github.com/polarours/hyprfetch"
keywords = ["hyprland", "wayland", "fetch", "cli", "rice"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.50", features = ["derive"] }
libc = "0.2.185"
owo-colors = "4.2.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
toml = "0.8.23"
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2.1.1"
insta = "1.43.2"
predicates = "3.1.3"
tempfile = "3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
